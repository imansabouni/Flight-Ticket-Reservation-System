<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Koltuk Seçimi</title>
  
  
  <link rel="stylesheet" href="style.css" />
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body>

<div class="container my-5">
  <div class="custom-card">
    <h2 id="title">Koltuk Seçimi</h2>

    <div class="text-center mb-4">
      <p class="fs-5" id="departure-time">Kalkış: 20 Ocak 2025 15:30</p>
      <p class="fs-5" id="fiyat">Toplam Fiyat: 0 TL</p>
    </div>

    <div class="koltuklar" id="koltuklar"></div>

    <div class="text-center mt-4">
      <button class="btn btn-lg btn-custom px-5" onclick="goToPayment()">Ödeme Sayfasına Git</button>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const kartAdi = urlParams.get('kart') || 'Koltuk Seçimi';
  const indirimOrani = parseFloat(urlParams.get('indirim')) || 0;

  const selectedSeats = [];
  const koltukFiyat = 100;

  document.getElementById("title").textContent = kartAdi;

  const koltuklarDiv = document.getElementById("koltuklar");

  for (let i = 1; i <= 20; i++) {
    const koltuk = document.createElement("div");
    koltuk.className = "koltuk";
    koltuk.textContent = "Koltuk " + i;
    koltuk.dataset.no = i;

    koltuk.onclick = () => {
      if (koltuk.classList.contains("disabled")) return;

      koltuk.classList.toggle("selected");
      const no = koltuk.dataset.no;

      if (selectedSeats.includes(no)) {
        selectedSeats.splice(selectedSeats.indexOf(no), 1);
      } else {
        selectedSeats.push(no);
      }

      calculatePrice();
    };

    koltuklarDiv.appendChild(koltuk);
  }

  function calculatePrice() {
    let fiyat = koltukFiyat * selectedSeats.length;
    fiyat -= fiyat * indirimOrani;
    document.getElementById("fiyat").textContent = `Toplam Fiyat: ${fiyat.toFixed(2)} TL`;
  }

  function goToPayment() {
    if (selectedSeats.length === 0) {
      alert("Lütfen en az 1 koltuk seçiniz.");
      return;
    }
    let fiyat = koltukFiyat * selectedSeats.length;
    fiyat -= fiyat * indirimOrani;
    localStorage.setItem("Toplam Fiyat", fiyat.toFixed(2));
    localStorage.setItem("Seçilen Koltuklar", selectedSeats.join(", "));
    localStorage.setItem("Kalkış Saati", "20 Ocak 2025 15:30");
    window.location.href = "odeme2.html";
  }
</script>

     <footer>
    <div class="footer-content">
      <span style="color: #764ba2; font-weight: 800;"><i class="fa-solid fa-plane"></i> ZAKAN BİLET © 2025</span>
      <span class="divider">|</span>
      <a href="giris.html" style="color: #4facfe;"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
      <a href="hakkimizda.html" style="color: #f72585;"><i class="fa-solid fa-circle-info"></i> Hakkımızda</a>
      <a href="iletisim.html" style="color: #f8961e;"><i class="fa-solid fa-envelope"></i> İletişim</a>
    </div>
  </footer>

</body>
</html>
