<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZAKAN KAYIT OL</title>
  
  
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
  <header>ZAKAN KAYIT</header>
  
  <div class="login-box">
    <h2>Kayıt Ol</h2>
    <input type="text" class="form-control" id="adsoyad" placeholder="Ad Soyad">
    <input type="email" class="form-control" id="email" placeholder="E-posta">
    <input type="password" class="form-control" id="sifre" placeholder="Şifre">
    <button class="btn-register" onclick="kayitOl()">Kayıt Ol</button>
    <div class="links">
      <a href="hesap.html">Zaten hesabın var mı?</a>
    </div>
    <p id="mesaj" class="text-center mt-3"></p>
  </div>

  <script>
    function kayitOl() {
      const adsoyad = document.getElementById("adsoyad").value.trim();
      const email = document.getElementById("email").value.trim();
      const sifre = document.getElementById("sifre").value.trim();
      const mesaj = document.getElementById("mesaj");

      if (adsoyad.length < 3 || sifre.length < 6 || !email.includes("@")) {
        mesaj.innerText = "Lütfen geçerli bilgiler giriniz.";
        mesaj.style.color = "red";
        return;
      }

      // localStorage kullanarak verileri kaydet
      let kullanicilar = JSON.parse(localStorage.getItem('kullanicilar') || '[]');
      
      const kontrol = kullanicilar.find(k => k.email === email);
      if (kontrol) {
        mesaj.innerText = "Bu e-posta ile zaten kayıtlısınız!";
        mesaj.style.color = "red";
        return;
      }

      kullanicilar.push({ adsoyad, email, sifre });
      localStorage.setItem('kullanicilar', JSON.stringify(kullanicilar));
      
      mesaj.innerText = "Kayıt başarılı! Lütfen giriş yapın.";
      mesaj.style.color = "green";
      
      // 1.5 saniye sonra giriş sayfasına yönlendir
      setTimeout(() => {
        window.location.href = "hesap.html";
      }, 1500);
    }
  </script>
      <footer>
    <div class="footer-content">
      <span style="color: #764ba2; font-weight: 800;"><i class="fa-solid fa-plane"></i> ZAKAN BİLET © 2025</span>
      <span class="divider">|</span>
      <a href="giris.html" style="color: #4facfe;"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
      <a href="hakkimizda.html" style="color: #f72585;"><i class="fa-solid fa-circle-info"></i> Hakkımızda</a>
      <a href="iletisim.html" style="color: #f8961e;"><i class="fa-solid fa-envelope"></i> İletişim</a>
    </div>
  </footer>
</body>
</html>
